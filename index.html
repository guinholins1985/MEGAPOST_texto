
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conteúdo Mágico AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            'brand-primary': '#4f46e5',
            'brand-secondary': '#7c3aed',
            'brand-accent': '#0ea5e9',
            'base-100': '#020617',
            'base-200': '#0f172a',
            'base-300': '#1e293b',
            'text-primary': '#e2e8f0',
            'text-secondary': '#94a3b8',
          },
          animation: {
            'gradient-bg': 'gradient-bg 15s ease infinite',
            'pulse-glow': 'pulse-glow 2s infinite ease-in-out',
          },
          keyframes: {
            'gradient-bg': {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
            },
            'pulse-glow': {
              '0%, 100%': { 
                boxShadow: '0 0 20px rgba(79, 70, 229, 0.4)',
              },
              '50%': {
                boxShadow: '0 0 35px rgba(79, 70, 229, 0.7)',
              }
            }
          }
        }
      }
    }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
  }
}
</script>
<style>
  body {
    background-color: #020617;
  }
  #root::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.2), transparent 40%),
                radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.2), transparent 40%);
    background-size: 200% 200%;
    animation: gradient-bg 15s ease infinite;
  }
</style>
</head>
<body class="bg-base-100 text-text-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
